name: Data Update Pipeline

on:
  # 🚫 取消 push 觸發，避免 bot 自動提交 embeddings
  workflow_dispatch:  # 僅手動觸發
    inputs:
      force_recomputation:
        description: 'Force recomputation even if no data changes detected'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write  # 允許推送到儲存庫
  actions: write   # 允許管理 Actions

jobs:
  update-embeddings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backup existing embeddings
        run: |
          mkdir -p data/embeddings/backup
          cp data/embeddings/*.npy data/embeddings/backup/ 2>/dev/null || echo "No existing embeddings to backup"
          cp data/embeddings/*.csv data/embeddings/backup/ 2>/dev/null || echo "No existing CSV files to backup"

      - name: Run precomputation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "🚀 Starting embedding computation..."
          echo "📊 Input files:"
          ls -la data/maps/map.csv data/raw/
          
          python scripts/precomputation_cicd.py
          
          echo "✅ Embedding computation completed"
          echo "📁 Generated files:"
          ls -la data/embeddings/

      - name: Validate embeddings
        run: |
          python -c "
          import numpy as np
          import pandas as pd
          import os
          
          # 檢查生成的檔案
          required_files = [
              'data/embeddings/description_embeddings.npy',
              'data/embeddings/keyidea_embeddings.npy',
              'data/embeddings/unique_keyidea_texts.csv'
          ]
          
          for file in required_files:
              if not os.path.exists(file):
                  raise FileNotFoundError(f'Required file missing: {file}')
              print(f'✅ {file} exists')
          
          # 檢查形狀：列數需對齊來源 CSV，維度需為 3072（text-embedding-3-large）
          EXPECTED_DIM = 3072
          desc_emb = np.load('data/embeddings/description_embeddings.npy')
          key_emb = np.load('data/embeddings/keyidea_embeddings.npy')

          print(f'📊 Description embeddings shape: {desc_emb.shape}')
          print(f'📊 Keyidea embeddings shape: {key_emb.shape}')

          if desc_emb.size == 0 or key_emb.size == 0:
              raise ValueError('Generated embeddings are empty')

          for name, emb in [('description', desc_emb), ('keyidea', key_emb)]:
              if emb.ndim != 2 or emb.shape[1] != EXPECTED_DIM:
                  raise ValueError(f'{name} embeddings dim mismatch: expected (N, {EXPECTED_DIM}), got {emb.shape}')

          map_rows = len(pd.read_csv('data/maps/map.csv'))
          if desc_emb.shape[0] != map_rows:
              raise ValueError(f'description embeddings rows ({desc_emb.shape[0]}) != map.csv rows ({map_rows})')

          unique_keyideas = len(pd.read_csv('data/embeddings/unique_keyidea_texts.csv'))
          if key_emb.shape[0] != unique_keyideas:
              raise ValueError(f'keyidea embeddings rows ({key_emb.shape[0]}) != unique_keyidea_texts rows ({unique_keyideas})')

          guidemeta_keyideas = pd.read_csv('data/raw/guidemeta_tw.csv')['keyidea'].nunique()
          if unique_keyideas != guidemeta_keyideas:
              raise ValueError(f'unique_keyidea_texts rows ({unique_keyideas}) != guidemeta_tw unique keyideas ({guidemeta_keyideas})')

          if os.path.exists('data/embeddings/content_embeddings.npy'):
              content_emb = np.load('data/embeddings/content_embeddings.npy')
              catalog_rows = len(pd.read_csv('data/embeddings/content_catalog.csv'))
              print(f'📊 Content embeddings shape: {content_emb.shape}')
              if content_emb.ndim != 2 or content_emb.shape[1] != EXPECTED_DIM:
                  raise ValueError(f'content embeddings dim mismatch: got {content_emb.shape}')
              if content_emb.shape[0] != catalog_rows:
                  raise ValueError(f'content embeddings rows ({content_emb.shape[0]}) != content_catalog rows ({catalog_rows})')

          print('✅ Embedding validation passed (rows aligned, dim = 3072)')
          "

      - name: Commit updated embeddings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # 添加變更的檔案 (只添加嵌入檔案，排除工作流程檔案)
          git add data/embeddings/
          git reset HEAD -- .github/workflows/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "📝 No embedding changes to commit"
          else
            # 生成詳細的 commit 訊息
            echo "📝 Committing embedding updates..."
            # 根據分支決定是否觸發後續部署
            if [ "${{ github.ref_name }}" = "main" ]; then
              SKIP_CI=""
              echo "📦 On main branch - will trigger deployment"
            else
              SKIP_CI="[skip ci]"
              echo "🔄 On development branch - skipping deployment"
            fi
            
            COMMIT_MSG="chore: Update embeddings after data file changes

            🔄 Triggered by: ${{ github.event_name }}
            📅 Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            🤖 Auto-generated by GitHub Actions
            
            Files updated:
            $(git diff --staged --name-only | sed 's/^/- /')
            
            $SKIP_CI"
            
            git commit -m "$COMMIT_MSG"
            git push origin ${{ github.ref_name }}
            echo "✅ Embeddings committed and pushed"
          fi

      - name: Create deployment tag
        if: success()
        run: |
          TAG_NAME="data-update-$(date +%Y%m%d-%H%M%S)"
          git tag -a "$TAG_NAME" -m "Data update: embeddings recomputed"
          git push origin "$TAG_NAME"
          echo "🏷️ Created tag: $TAG_NAME"

  notify-completion:
    runs-on: ubuntu-latest
    needs: update-embeddings
    if: always()
    steps:
      - name: Notify status
        run: |
          if [ "${{ needs.update-embeddings.result }}" == "success" ]; then
            echo "🎉 Data update pipeline completed successfully!"
            echo "✅ Embeddings have been recomputed and committed"
            echo "🚀 Main deployment pipeline will be triggered automatically"
          else
            echo "💥 Data update pipeline failed!"
            echo "❌ Please check the logs and fix any issues"
          fi
